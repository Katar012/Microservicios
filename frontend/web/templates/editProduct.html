<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2>Edit Product</h2>
    <a href="/products" class="btn btn-secondary mb-3">Back to Products</a>
    <form id="edit-product-form">
        <input type="hidden" id="product-id" value="">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" step="0.01" class="form-control" id="price" required>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" class="form-control" id="quantity" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<!-- 1. Shared fetch wrapper loaded FIRST -->
<script src="/static/scriptCommon.js"></script>
<!-- 2. Product script loaded SECOND -->
<script src="/static/scriptProducts.js"></script>

<script>
    const productId = {{ id }};

    apiFetch(`/api/products/${productId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('product-id').value = data.id;
            document.getElementById('name').value = data.name;
            document.getElementById('price').value = data.price;
            document.getElementById('quantity').value = data.quantity;
        })
        .catch(error => console.error('Error loading product details:', error));

    document.getElementById('edit-product-form').addEventListener('submit', function(event) {
        event.preventDefault();
        updateProduct();
    });
</script>

</body>
</html>
