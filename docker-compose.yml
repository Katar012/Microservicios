name: microwebapp

services:

  # ----------------------- Databases -----------------------
  users_db:
    image: mysql:8.0
    container_name: users_db
    command: --innodb-buffer-pool-size=64M --innodb-log-buffer-size=8M --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: users_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - users_db_data:/var/lib/mysql
      - ./microUsers/db/users_db.sql:/docker-entrypoint-initdb.d/01-users_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - app_network

  products_db:
    image: mysql:8.0
    container_name: products_db
    command: --innodb-buffer-pool-size=64M --innodb-log-buffer-size=8M --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: products_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - products_db_data:/var/lib/mysql
      - ./microProducts/db/products_db.sql:/docker-entrypoint-initdb.d/01-products_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - app_network

  orders_db:
    image: mysql:8.0
    container_name: orders_db
    command: --innodb-buffer-pool-size=64M --innodb-log-buffer-size=8M --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: orders_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - orders_db_data:/var/lib/mysql
      - ./microOrders/db/orders_db.sql:/docker-entrypoint-initdb.d/01-orders_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - app_network

  # ----------------------- Microservices -----------------------
  microusers:
    build: ./microUsers
    container_name: microusers
    ports:
      - "3001:5002" # Published port so HAProxy on 192.168.100.2 can reach it at 192.168.100.3:3001
    environment:
      MYSQL_HOST: users_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      MYSQL_DB: users_db
    depends_on:
      users_db:
        condition: service_healthy
    networks:
      - app_network

  microproducts:
    build: ./microProducts
    container_name: microproducts
    ports:
      - "3002:5003" # Published port so HAProxy can reach it at 192.168.100.3:3002
    environment:
      MYSQL_HOST: products_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      MYSQL_DB: products_db
    depends_on:
      products_db:
        condition: service_healthy
    networks:
      - app_network

  microorders:
    build: ./microOrders
    container_name: microorders
    ports:
      - "3003:5004" # Published port so HAProxy can reach it at 192.168.100.3:3003
    environment:
      MYSQL_HOST: orders_db
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
      MYSQL_DB: orders_db
      SECRET_KEY: ${SECRET_KEY:-secret123}
      PRODUCTS_SERVICE_URL: http://microproducts:5003
    depends_on:
      orders_db:
        condition: service_healthy
    networks:
      - app_network

  # --------------------------- Frontend ---------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-8080}:5001"
    environment:
      USERS_SERVICE_URL: http://microusers:5002
      PRODUCTS_SERVICE_URL: http://microproducts:5003
      ORDERS_SERVICE_URL: http://microorders:5004
      SECRET_KEY: ${SECRET_KEY:-secret123}
    depends_on:
      - microusers
      - microproducts
      - microorders
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  users_db_data:
  products_db_data:
  orders_db_data:
